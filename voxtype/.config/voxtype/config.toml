state_file = "auto"

[hotkey]
key = "SCROLLLOCK"

modifiers = []

[audio]
device = "default"

sample_rate = 16000

max_duration_secs = 180

[whisper]

model = "large-v3-turbo"

language = "auto"

translate = true

eager_processing = true
on_demand_loading = true

[output]
mode = "type"

fallback_to_clipboard = true

type_delay_ms = 0

[output.notification]
on_recording_start = false

on_recording_stop = false

on_transcription = false

[osd]
frontend = "native"

style = "default"

layout = "compact"

[vad]
enabled = true
